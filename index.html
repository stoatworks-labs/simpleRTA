<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A free real-time audio analyser that runs in a browser tab: an RTA from 1/3 to 1/48 octave, a spectrograph sharing its frequency axis, and a full-height peak and RMS meter."
    />
    <title>simpleRTA — real-time audio analyser</title>
    <link rel="canonical" href="https://simple-rta.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://simple-rta.stoatworks-labs.com/">
    <meta property="og:title" content="simpleRTA — real-time audio analyser">
    <meta property="og:description" content="A free real-time audio analyser that runs in a browser tab: an RTA from 1/3 to 1/48 octave, a spectrograph sharing its frequency axis, and a full-height peak and RMS meter.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/simplerta.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="simpleRTA — real-time audio analyser">
    <meta name="twitter:card" content="summary_large_image">
    <!-- One entity with the tool's page on stoatworks-labs.com: same @id there. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "@id": "https://simple-rta.stoatworks-labs.com#app",
        "name": "simpleRTA",
        "url": "https://simple-rta.stoatworks-labs.com",
        "description": "A free real-time audio analyser that runs in a browser tab: an RTA from 1/3 to 1/48 octave, a spectrograph sharing its frequency axis, and a full-height peak and RMS meter.",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP"
        },
        "author": {
          "@id": "https://stoatworks-labs.com/#organization",
          "@type": "Organization",
          "name": "Stoatworks Labs",
          "url": "https://stoatworks-labs.com/"
        },
        "publisher": {
          "@id": "https://stoatworks-labs.com/#organization"
        },
        "sameAs": [
          "https://stoatworks-labs.com/web-tools/simplerta/",
          "https://github.com/stoatworks-labs/simpleRTA"
        ]
      }
    </script>
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/simplerta.png">
      <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons and wants a PNG of its own. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Tints the status bar when installed. Two, so it follows the theme. -->
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <noscript>
      <h1>simpleRTA</h1>
      <p>A real-time analyser in a browser tab.</p>
      <p>A real-time audio analyser that runs entirely in a browser tab: an RTA from 1/3 to 1/48 octave, a spectrograph sharing its frequency axis, and a full-height meter with peak, RMS, peak hold and broadband Z/A/C. The transform chain is pinned down by tests at every size and window, and the built-in pink noise source is there so you can check it reads level properly before you believe anything it tells you about a room.</p>
      <p>simpleRTA runs in the browser and needs JavaScript.</p>
      <ul>
        <li><a href="https://stoatworks-labs.com/software/simplerta/">simpleRTA on stoatworks-labs.com</a></li>
        <li><a href="https://stoatworks-labs.com/software/simplerta/guide/">User guide</a></li>
        <li><a href="https://github.com/stoatworks-labs/simpleRTA">Source on GitHub</a></li>
        <li><a href="https://stoatworks-labs.com/web-tools/self-hosting/">Running it on your own server</a></li>
      </ul>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.

      data-repo points at LEQtion, not at this repo, and that is deliberate:
      simpleRTA's own repo is private, so a link to it 404s for every visitor.
      LEQtion is the public desktop analyser and is the source a reader who
      follows "the source is on GitHub" from here is being sent to.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="simpleRTA"
      data-repo="https://github.com/stoatworks-labs/simpleRTA"
      data-note="It runs entirely in your browser — the microphone signal is analysed on your machine and never uploaded."
    ></script>
  </body>
</html>
